spring:
  application:
    name: gestao-jogos
  datasource:
    url: jdbc:postgresql://localhost:5432/gestao_jogos
    username: dev
    password: dev
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
gestao-jogos:
  admin-inicial:
    habilitado: true
    nome: Administrador
    email: ${GESTAO_JOGOS_ADMIN_INICIAL_EMAIL:admin@clube.local}
    senha: ${GESTAO_JOGOS_ADMIN_INICIAL_SENHA:admin12345}