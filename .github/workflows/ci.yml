name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # O PostgreSQL é provisionado pelo Testcontainers durante os testes,
      # usando o Docker já disponível no runner. Não é preciso declarar
      # um service container aqui.
      - name: Build e testes
        run: ./mvnw --batch-mode verify
